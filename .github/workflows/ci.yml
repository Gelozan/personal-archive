on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─── JOB 1: Линтинг ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Кэш pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: pip-lint-

      - run: pip install ruff
      - run: ruff check backend/app

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Кэш pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - run: pnpm lint
        working-directory: frontend

  # ─── JOB 2: Тесты (параллельно с lint) ──────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Кэш pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: pip-test-

      - run: pip install -r backend/requirements.txt

      - name: Run pytest
        working-directory: tests
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpassword@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 15
          REFRESH_TOKEN_EXPIRE_DAYS: 30
          S3_ENDPOINT_URL: https://storage.yandexcloud.net
          S3_BUCKET_NAME: test-bucket
          S3_ACCESS_KEY: test-key
          S3_SECRET_KEY: test-secret
          S3_REGION: ru-central1
          MAX_FILE_SIZE_MB: 20
          PRESIGNED_URL_EXPIRE_SECONDS: 3600
        run: pytest app/tests -v --tb=short

      # pip-audit в отдельном step, зависимости уже установлены
      - name: Security audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt

  # ─── JOB 3: Сборка (только после lint И test) ────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]  # ← ждёт оба

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 4: Деплой ───────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # checkout не нужен — всё делается по SSH на сервере
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/personal-archive
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
